services:
  backend:
    image: 103.226.249.128:8142/huongnghiep/huongnghiep-backend:${TAG:-latest}
    pull_policy: always
    env_file: backend/.env
    restart: unless-stopped
    ports:
      - "3060:3060"
    volumes:
      - ./backend/thu_vien:/srv/backend/thu_vien
      - ./backend/logs:/srv/backend/logs

  frontend:
    image: 103.226.249.128:8142/huongnghiep/huongnghiep-frontend:${TAG:-latest}
    pull_policy: always
    environment:
      BACKEND_URL: http://backend:3060
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
